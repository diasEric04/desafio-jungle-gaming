x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_WAGER_QUEUE: wager-transactions.fifo
  SQS_WAGER_DLQ: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE: wager-events.fifo

x-app: &app
  build: .
  depends_on:
    migrate:
      condition: service_completed_successfully
    provision:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 3s
      timeout: 3s
      retries: 20
    command: ['postgres', '-c', 'max_connections=300']

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health | grep -q "\"sqs\": \"\\(available\\|running\\)\""']
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot: create the FIFO queues + DLQ redrive policy (same code the tests use).
  provision:
    build: .
    command: ['bun', 'scripts/provision-queues.ts']
    environment: *app-env
    depends_on:
      localstack:
        condition: service_healthy
    restart: 'no'

  # One-shot: apply versioned migrations before any app instance starts.
  migrate:
    build: .
    command: ['bun', 'scripts/migrate.ts', 'up']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Three identical instances competing for the same database and queues.
  app-1:
    <<: *app
    environment:
      <<: *app-env
      PORT: '3000'
    ports:
      - '3001:3000'

  app-2:
    <<: *app
    environment:
      <<: *app-env
      PORT: '3000'
    ports:
      - '3002:3000'

  app-3:
    <<: *app
    environment:
      <<: *app-env
      PORT: '3000'
    ports:
      - '3003:3000'
